name: Build
on:
  push:
    branches:
      - main 
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Test and collect coverage
        run: |
          xcrun swift test --enable-code-coverage
          coverage_json="$(xcrun swift test --show-codecov-path)"
          coverage_directory="$(dirname "$coverage_json")"
          build_directory="$(dirname "$coverage_directory")"
          test_binary="$build_directory/AeroSpacePreviewPackageTests.xctest/Contents/MacOS/AeroSpacePreviewPackageTests"
          xcrun llvm-cov show \
            "$test_binary" \
            -instr-profile="$coverage_directory/default.profdata" \
            -ignore-filename-regex='(\.build|Tests)/' \
            > .build/sonar-coverage.report
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
